[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mocap-dashboard"
version = "0.1.0.dev0"
description = "Local film-workflow dashboard: Python backend serving the React UI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
mocap-dashboard = "mocap_dashboard.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["mocap_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
